name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Node ${{ matrix.node }} / frontend, Go backend, reference parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:media

      - name: Local API regressions
        if: matrix.node == 24
        run: npm run test:api
      - name: Install browser for cloud acceptance
        if: matrix.node == 24
        run: npx playwright install --with-deps chromium
      - name: Interactive landing page
        if: matrix.node == 24
        run: npm run build:landing && npm run test:landing
      - name: Go server race tests
        if: matrix.node == 24
        run: npm run test:server
      - name: Cloud contract against Go API
        if: matrix.node == 24
        run: npm run test:cloud:go
      - name: Cloud browser against Go API
        if: matrix.node == 24
        run: npm run test:cloud:go:e2e
      - name: Local browser against Go backend
        if: matrix.node == 24
        run: npm run test:local:go:e2e
        env:
          HYPERCUT_BROWSER: chromium
      - name: Legacy media reference
        run: npm run test:reference:media
      - name: Go static checks
        if: matrix.node == 24
        run: go vet ./...
